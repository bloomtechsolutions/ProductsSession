function syncDeadlines(m){const now=Date.now();

  DL.clue=m.cl&&m.cl.leftMs!=null?now+m.cl.leftMs:null;DL.clueNext=m.cl&&m.cl.nextMs!=null?now+m.cl.nextMs:null;

/* ---------- scenes ---------- */
let curKey="",introUntil=0,lastGameView=null,lastScore={},facts=0;
function sceneKey(m){
  if(!m)return "home";
  if(m.modal==="qr")return "join";
  if(m.modal==="stand")return "stand:"+(m.just||"");
  if(Date.now()<introUntil)return "intro:"+m.v;
  switch(m.v){
    case "warmup":return `mf:${m.mf.i}:${m.mf.shown}:${m.mf.open}`;
    case "library":{const p=m.pp;return `pp:${p.picking}:${p.live?p.live.team:""}:${p.last?p.last.team+p.last.pts:""}`}
    case "challenge":{const o=m.quiz.open;return o?`quiz:${o.k}:${o.revealed}`:"quiz:board"}
    case "clues":return `cl:${m.cl.i}:${m.cl.step}:${m.cl.phase}`;
    case "spin":{const s=m.sp;return `sp:${s.phase}:${s.team}:${s.pick}:${s.spin?s.spin.id:""}`}
    case "close":return "winner";
    default:return m.join?"home:join":"home";
  }
}
function render(force){
  const m=M,key=sceneKey(m);
  $("#topRight").textContent=m&&m.code?`Join · ${m.code}`:(sess?`Session ${sess.code}`:"");
  $("#ticker").hidden=!(key==="home"||key==="join"||key.startsWith("stand")||key==="quiz:board"||(key.startsWith("pp:")&&!(m.pp.live||m.pp.last)));
  if(key===curKey&&!force){update();return}
  const prev=curKey;curKey=key;
  const [kind]=key.split(":");
  const fn={home:sHome,join:sJoin,intro:sIntro,mf:sMF,pp:sPP,quiz:sQuiz,cl:sClue,sp:sSpin,stand:sStand,winner:sWinner}[kind]||sHome;
  scene.innerHTML="";fn(m,prev);update();
}
function update(){
  const m=M;if(!m)return;const now=Date.now();
  // answered strips and live bits that change within a scene
  // Redraw a part only when its content changed, so check-in animations don't replay on every heartbeat.
  const put=(el,html)=>{if(el&&el._html!==html){el._html=html;el.innerHTML=html}};
  const ans=$("#answered");if(ans)put(ans,answeredChips(m.answered||[],ans.dataset.except||null));
  put($("#teamRows"),teamRowsHtml());
  if(m.pp)put($("#pkBoard"),picksHtml(m.pp));
  if(m.quiz)put($("#qBoard"),quizBoardHtml(m.quiz));
  tickTimers(now);
}
let lastSec={};
function tickTimers(now){
  const tick=(id,dl,secs)=>{const el=$("#"+id);if(!el||dl==null)return;const left=Math.max(0,dl-now),n=Math.ceil(left/1000);
    if(el.classList.contains("ring")){el.querySelector("span").textContent=n;el.querySelector(".arc").style.strokeDashoffset=119.4*(1-left/(secs*1000));el.classList.toggle("low",n<=5&&n>0)}
    else{el.textContent=String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");el.classList.toggle("low",n<=5&&n>0)}
    if(n!==lastSec[id]&&n<=5&&n>0)sTick();lastSec[id]=n;};
  if(M&&M.quiz&&M.quiz.open)tick("qRing",DL.quiz,M.quiz.open.secs||20);
  if(M&&M.cl)tick("clRing",DL.clue,M.cl.secs||20);
  if(M&&M.sp){tick("spPitch",DL.pitch,M.sp.secs||30);tick("spVote",DL.vote,20)}
  const nb=$("#nextBar");if(nb&&DL.clueNext!=null){const left=Math.max(0,DL.clueNext-now);nb.querySelector("i").style.width=(100-left/80)+"%";nb.querySelector("span").textContent=`Next question in ${Math.ceil(left/1000)}…`}
}
setInterval(()=>{if(M&&introUntil&&Date.now()>=introUntil){introUntil=0;render()}else tickTimers(Date.now())},100);

// The wheel replays the console's spin with the same start angle, distance and duration.
let wheelAng=0,wheelSpinId=null;
function drawWheel(cv,labels,ang){
  const cx=cv.getContext("2d"),W=cv.width,R=W/2-8,n=labels.length,seg=2*Math.PI/n,cols=["#c4122f","#26303c","#0b7f83","#b77900","#4b5fb0","#16794a"];
  cx.clearRect(0,0,W,W);cx.save();cx.translate(W/2,W/2);cx.rotate(ang);
  for(let i=0;i<n;i++){cx.beginPath();cx.moveTo(0,0);cx.arc(0,0,R,i*seg,(i+1)*seg);cx.closePath();cx.fillStyle=cols[i%cols.length];cx.fill();cx.strokeStyle="rgba(255,255,255,.8)";cx.lineWidth=3;cx.stroke();
    cx.save();cx.rotate(i*seg+seg/2);cx.textAlign="right";cx.textBaseline="middle";cx.fillStyle="#fff";cx.font=`700 ${Math.round(W/30)}px Figtree, system-ui, sans-serif`;const t=labels[i];cx.fillText(t.length>20?t.slice(0,19)+"…":t,R-16,0);cx.restore()}
  cx.beginPath();cx.arc(0,0,W*.06,0,2*Math.PI);cx.fillStyle="#111";cx.fill();cx.restore();
}
function sSpin(m,prev){
  const s=m.sp,t=team(s.team)||team(s.up)||{name:"",col:"#666"};
  let side="";

  else if(s.phase==="waiting")side=`<div class="label"><b>Over to you</b></div><div class="big" style="font-size:4.4cqw;color:${t.col}">${esc(t.name)}</div><div class="big" style="font-size:2.4cqw">Press SPIN on your phone!</div>`;
  else if(s.phase==="spinning")side=`<div class="label">${esc(t.name)}</div><div class="big" style="font-size:4cqw">Spinning…</div>`;
  else if(["ready","pitch","pitched","vote"].includes(s.phase))side=`<div class="label">${esc(t.name)} · ${s.secs}-second pitch</div><div id="pickB"></div>
    ${s.phase==="pitch"?`<div class="timer" id="spPitch">00:${String(s.secs).padStart(2,"0")}</div><div class="label"><b>Feature · Advantage · Benefit</b></div>`:""}
    ${s.phase==="ready"?`<div class="label"><b>Get ready…</b></div>`:""}
    ${s.phase==="pitched"?`<div class="timer">00:00</div><div class="label"><b>Time's up</b></div>`:""}
    ${s.phase==="vote"?`<div class="timer vote" id="spVote">00:20</div><div class="label"><b>Vote now on your phones!</b></div><div id="answered" data-except="${esc(s.team)}"></div>`:""}`;
  else if(s.phase==="result"&&s.result){const rt=team(s.result.team)||t;
    side=`<div class="label">${esc(s.result.pick)}</div><div class="big" style="font-size:3.6cqw;color:${rt.col}">${esc(rt.name)}</div><div class="pts">+${s.result.pts}</div>
      ${s.result.crit.map((c,i)=>`<div class="avg"><span>${esc(c)}</span>${starRow(s.result.avg[i])}<span class="mono">${s.result.avg[i].toFixed(1)}</span></div>`).join("")}`;
    if(prev&&prev.startsWith("sp:")){sChime();confetti([rt.col])}}
  scene.innerHTML=`<div class="label">Round 5 · Spin &amp; explain</div><div class="grid2" style="align-items:center"><div class="wheelbox"><div class="ptr"></div><canvas id="wheel" width="900" height="900"></canvas></div><div style="display:flex;flex-direction:column;gap:1.2cqw;min-width:0">${side}</div></div>`;
  const cv=$("#wheel");drawWheel(cv,s.wheel,wheelAng);
  if(s.pick&&$("#pickB")){const b=flapBoard(wrapWords(s.pick.toUpperCase(),12).slice(0,3),12,{colors:["sun","sun","sun"],size:"3.2cqw"});$("#pickB").appendChild(b);b.play()}
  if(s.spin&&s.spin.id!==wheelSpinId){wheelSpinId=s.spin.id;const {start,delta,dur}=s.spin,t0=performance.now()-(s.spin.elapsed||0);
    const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,4);wheelAng=start+delta*e;const c=$("#wheel");if(c)drawWheel(c,s.wheel,wheelAng);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
}
function sStand(m){

  const prevRank=Object.fromEntries(prevList.map(t=>[t.id,rankOf(prevList,t)])),max=Math.max(1,...list.map(t=>t.score));

    <div class="done"><span style="border:0">GAMES FINISHED</span>${["True or False","Product Passport","Product Challenge","Listen for the Clue","Spin & Explain"].map(n=>`<span class="${m.finished.some(g=>g[1]===n)?"on":""}">${m.finished.some(g=>g[1]===n)?"✓ ":""}${esc(n)}</span>`).join("")}</div>`;
  $("#sb").appendChild(b);b.play();

// Break a phrase into lines of at most `w` characters, keeping words whole.
function wrapWords(text,w){const out=[];let cur="";text.split(" ").forEach(x=>{if((cur+" "+x).trim().length>w){if(cur)out.push(cur.trim());cur=x}else cur+=" "+x});if(cur.trim())out.push(cur.trim());return out}

/* ---------- applying the console's state ---------- */
function apply(m){
  const firstGame=GAME_INTRO[m.v]&&m.v!==lastGameView&&!m.modal;
  if(GAME_INTRO[m.v])lastGameView=m.v;else if(m.v==="plan")lastGameView=null;
  if(firstGame&&M&&!reduce)introUntil=Date.now()+3600;
  soundOn=m.sound!==false;
  M=m;gotAt=Date.now();syncDeadlines(m);$("#live").classList.add("on");render();
}
window.__screen={apply,key:()=>curKey};   // used by the automated tests

/* ---------- connecting to the session ---------- */
async function start(){
  const code=(new URLSearchParams(location.search).get("s")||"").trim().toUpperCase();
  if(!code){askCode();return}
  render(true);
  if(!sb)return;
  const {data}=await sb.from("sessions").select("id,code,name").eq("code",code).maybeSingle();
  if(!data){askCode("No session found with code "+code);return}
  sess=data;
  loadTeams();
  const ch=sb.channel("kykp:"+sess.id).on("broadcast",{event:"screen"},({payload})=>apply(payload))
    .subscribe(st=>{if(st==="SUBSCRIBED")ch.send({type:"broadcast",event:"hello",payload:{}})});
  // Ask the console for its state until it answers, and show the home board meanwhile.
  setInterval(()=>{if(Date.now()-gotAt>6000){$("#live").classList.remove("on");try{ch.send({type:"broadcast",event:"hello",payload:{}})}catch(_){}loadTeams()}},5000);
}
async function loadTeams(){
  if(!sess||M)return;
  const [t,e]=await Promise.all([sb.from("teams").select("*").eq("session_id",sess.id).order("position"),sb.from("score_events").select("team_id,points").eq("session_id",sess.id)]);
  if(t.error)return;const cols=["#c4122f","#0b7f83","#b77900","#4b5fb0","#7a3fa0","#16794a"];
  dbTeams=t.data.map(x=>({id:x.id,name:x.name,col:cols[x.color_idx%6],claimed:!!x.claimed,score:(e.data||[]).filter(v=>v.team_id===x.id).reduce((a,v)=>a+v.points,0)}));
  render(true);
}
function askCode(msg){
  scene.innerHTML=`<form class="entry" id="ef"><div class="label"><b>Audience screen</b> · enter the session code from the facilitator's console</div><input id="ec" maxlength="6" autocomplete="off" aria-label="Session code" placeholder="CODE">${msg?`<div class="label" style="color:var(--bad)">${esc(msg)}</div>`:""}<button>Show the screen</button></form>`;
  $("#ef").onsubmit=e=>{e.preventDefault();const v=$("#ec").value.trim().toUpperCase();if(v){const u=new URL(location.href);u.searchParams.set("s",v);location.href=u.toString()}};
}
// "Did you know?" facts rotate on the home board, between games and under the standings.
function nextFact(){const f=$("#fact");f.textContent=FACTS[facts++%FACTS.length];f.style.animation="none";void f.offsetWidth;f.style.animation=""}
nextFact();setInterval(nextFact,9000);
start();
})();
</script>
