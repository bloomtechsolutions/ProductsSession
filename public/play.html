<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one column for a phone held by one person per team. Header shows the team and its score;
   the stage shows whatever the facilitator has sent: waiting, a question, or the result. */
:root{
  --paper:#eef3f6; --surface:#ffffff; --surface-2:#f6f9fb; --ink:#0f2238; --muted:#566779; --line:#d5dfe6;
  --accent:#c4122f; --accent-ink:#ffffff; --accent-soft:#fbe6ea;
  --lagoon:#0b7f83; --lagoon-soft:#dff2f2; --sun:#b77900; --sun-soft:#fdf1d8;
  --good:#16794a; --good-soft:#dcf3e6; --bad:#b42318; --bad-soft:#fde4e1;
  --shadow:0 1px 2px rgba(15,34,56,.06),0 8px 24px rgba(15,34,56,.07);
  --bar:#0f2238; --bar-fg:#eef3f6;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0a1522; --surface:#112135; --surface-2:#0e1c2d; --ink:#e6eef5; --muted:#9db0c3; --line:#22374f;
  --accent:#ff5470; --accent-ink:#1a0308; --accent-soft:#3a1420;
  --lagoon:#41c7c3; --lagoon-soft:#0f3236; --sun:#f2b84b; --sun-soft:#3a2c10;
  --good:#4cd38b; --good-soft:#0f3322; --bad:#ff7a6b; --bad-soft:#3d1713;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --bar:#050d17; --bar-fg:#e6eef5; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a1522; --surface:#112135; --surface-2:#0e1c2d; --ink:#e6eef5; --muted:#9db0c3; --line:#22374f;
  --accent:#ff5470; --accent-ink:#1a0308; --accent-soft:#3a1420;
  --lagoon:#41c7c3; --lagoon-soft:#0f3236; --sun:#f2b84b; --sun-soft:#3a2c10;
  --good:#4cd38b; --good-soft:#0f3322; --bad:#ff7a6b; --bad-soft:#3d1713;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --bar:#050d17; --bar-fg:#e6eef5; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;line-height:1.12;margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-stretch:118%;font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

.top{position:sticky;top:0;z-index:10;background:var(--bar);color:var(--bar-fg);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-stretch:120%;font-weight:800;font-size:.95rem;margin-right:auto;color:var(--bar-fg)}
.me{display:flex;align-items:center;gap:10px;border-left:5px solid var(--tc,transparent);padding-left:10px}
.me b{font-size:1rem;color:var(--bar-fg)}
.me .sc{font-family:var(--f-mono);font-weight:700;font-size:1.3rem;color:var(--bar-fg)}
.me small{display:block;font-size:.72rem;opacity:.75;color:var(--bar-fg)}
.conn{width:9px;height:9px;border-radius:50%;background:#ff7a6b;flex:none}
.conn.live{background:#4cd38b}

main{max-width:560px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:default}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;color:var(--ink)}
.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--f-mono);font-size:1.6rem;text-align:center}
textarea.field{min-height:92px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.teams{display:grid;gap:8px}
.tpick{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);border-left:6px solid var(--tc);background:var(--surface);border-radius:14px;padding:14px;font-weight:700;font-size:1.05rem}
.tpick small{margin-left:auto;font-weight:600;font-size:.8rem;color:var(--muted)}
.tpick:disabled{opacity:.55;cursor:default}

.wait{align-items:center;text-align:center;padding:36px 18px}
.dots{display:flex;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--lagoon);animation:b 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{50%{opacity:.2;transform:translateY(-4px)}}
.q{font-family:var(--f-display);font-stretch:106%;font-weight:750;font-size:1.35rem;line-height:1.22}
.sub{font-size:.88rem;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px;font-weight:650;font-size:1.05rem;min-height:58px}
.opt .k{font-family:var(--f-mono);font-weight:700;background:var(--ink);color:var(--paper);border-radius:8px;min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt[aria-pressed="true"]{border-color:var(--tc,var(--accent));background:color-mix(in srgb,var(--tc,var(--accent)) 14%,var(--surface))}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.mf .opts{grid-template-columns:1fr 1fr}
.mf .opt{justify-content:center;font-family:var(--f-display);font-stretch:120%;font-weight:900;font-size:1.4rem;min-height:84px}
.sent{font-size:.9rem;font-weight:700;color:var(--good)}
.persona b{font-family:var(--f-display);font-size:1.2rem}
.says{font-style:italic;border-left:3px solid var(--accent);padding-left:10px}
.pool{display:grid;gap:12px}
.pool-fam{display:flex;flex-wrap:wrap;gap:6px}
.pool-fam > span{width:100%}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:.92rem;font-weight:650}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.hit{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.stick{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.banner{border-radius:16px;padding:16px;font-family:var(--f-display);font-stretch:115%;font-weight:900;font-size:1.5rem;text-align:center}
.banner.good{background:var(--good-soft);color:var(--good)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--lagoon-soft);color:var(--lagoon);font-size:1.1rem}
.lb{display:grid;gap:6px}
.lb div{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:8px;align-items:center;border-left:4px solid var(--tc);padding:4px 0 4px 10px;font-size:.95rem}
.lb .me-row{font-weight:800}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0}
.stand{width:100%;border-collapse:collapse;font-size:.95rem}
.stand th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px;border-bottom:2px solid var(--line)}
.stand td{padding:8px 6px;border-bottom:1px solid var(--line)}
.stand td:nth-child(2){border-left:4px solid var(--tc)}
.stand .num{text-align:right}
.stand .me-row td{font-weight:800;background:color-mix(in srgb,var(--tc) 10%,transparent)}
.mine{border-left:6px solid var(--tc)}
.mine-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mine-grid .big{display:block;font-size:1.9rem;font-weight:700}
.mine-grid small{color:var(--muted);font-size:.78rem}
.games{display:grid;gap:6px}
.games > div{display:flex;justify-content:space-between;gap:8px;background:var(--good-soft);color:var(--good);border-radius:10px;padding:8px 12px;font-weight:700}
.crit{display:grid;gap:6px;padding:4px 0}
.stars{display:flex;gap:6px}
.star{flex:1;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;font-size:1.6rem;line-height:1;padding:10px 0;color:var(--line)}
.star[aria-pressed="true"]{color:var(--sun);border-color:var(--sun);background:var(--sun-soft)}
.crit-list{margin:0;padding-left:22px;font-weight:700}
.avg-row{display:grid;grid-template-columns:minmax(0,1fr) auto 2.4em;gap:8px;align-items:center;font-size:.95rem}
.srow i{font-style:normal;color:var(--line)}
.srow i.on{color:var(--sun)}
.srow i.half{color:color-mix(in srgb,var(--sun) 50%,var(--line))}
.note-row{border-left:3px solid var(--tc);padding-left:10px;font-size:.95rem}
.mypicks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pk-mine,.pk-empty{border-radius:12px;padding:10px 12px;font-weight:700;font-size:.95rem;text-align:center}
.pk-mine{background:var(--good-soft);color:var(--good);border:1.5px solid var(--good)}
.pk-mine.big{font-size:1.15rem;text-align:left}
.pk-empty{border:1.5px dashed var(--line);color:var(--muted)}
.pk-list{display:grid;gap:8px}
.pkb{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:650;min-height:52px}
.pkb small{font-weight:700;font-size:.75rem;color:var(--muted);white-space:nowrap}
.pkb.mine{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.pkb.mine small{color:var(--good)}
.pkb.taken{background:var(--surface-2);color:var(--muted);border-left:6px solid var(--tc)}
.pkb.taken span{text-decoration:line-through}
.pkb:disabled{cursor:default}
.pkb:disabled:not(.taken){opacity:.55}
.cdbar{position:relative;height:30px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.cdbar i{position:absolute;inset:0 auto 0 0;background:var(--lagoon-soft);transition:width .2s linear}
.cdbar span{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;height:100%;font-weight:700;color:var(--lagoon)}
.cdbar.low i{background:var(--accent-soft)}
.cdbar.low span{color:var(--accent)}
.banner.speedb{background:var(--sun-soft);color:var(--sun);font-size:1.15rem;margin-top:-6px}
.spinbtn{margin:10px auto 0;width:min(240px,70vw);aspect-ratio:1;border-radius:50%;border:0;background:var(--tc);color:#fff;font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:2.6rem;letter-spacing:.06em;box-shadow:0 10px 30px color-mix(in srgb,var(--tc) 45%,transparent);animation:throb 1.4s ease-in-out infinite}
.spinbtn:disabled{animation:none;opacity:.6}
@keyframes throb{50%{transform:scale(1.05)}}
.cust{background:var(--sun-soft);color:var(--sun);border-radius:12px;padding:10px 12px;font-size:1rem}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<body>
<header class="top"><div class="top-in"><span class="brand">KYC · KYP</span><div class="me" id="me"></div><span class="conn" id="conn" title="Connection"></span></div></header>
<main id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="vendor/supabase-2.117.3.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("kykp:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("kykp:"+k,JSON.stringify(v))}catch(e){}}};
const SB_URL="https://jtofxcdoyzyyxdlbjrbh.supabase.co", SB_KEY="sb_publishable_UduFSvz4bpmCY41kxjLRww_iufXEQpx";
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}}):null;
const TCOL=["#c4122f","#0b7f83","#b77900","#4b5fb0","#7a3fa0","#16794a"],MAX_TEAMS=6;
const app=$("#app");

let sess=null,me=null,teams=[],events=new Map(),round=null,chan=null,pollT=null;
let picks=new Map();  // Product Passport: product id -> team id
let draft={};       // round id -> answer being built on this phone
let sentFor={};     // round id -> last answer this phone sent
let shownKey="";    // what the stage currently shows, so typing is not interrupted by re-renders

const tcol=t=>TCOL[t.color_idx%TCOL.length];
const myTeam=()=>me&&teams.find(t=>t.id===me.team_id);
const score=id=>{let s=0;for(const e of events.values())if(e.team_id===id)s+=e.points;return s};
// Tied teams share a rank: 1 + the number of teams with a strictly higher score.
const rankOf=id=>1+teams.filter(x=>score(x.id)>score(id)).length;
const ranked=()=>[...teams].map(t=>({t,s:score(t.id)})).sort((a,b)=>b.s-a.s);
function toast(msg,bad){const el=$("#toast");el.textContent=msg;el.classList.toggle("bad",!!bad);el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,bad?5000:2200)}
async function call(fn,args){const {data,error}=await sb.rpc(fn,args);if(error){toast(error.message||"Could not reach the server. Try again.",true);throw error}return data}

/* ---------- session and seat ---------- */
async function openSession(code){
  code=String(code||"").trim().toUpperCase();
  const {data,error}=await sb.from("sessions").select("id,code,name").eq("code",code).maybeSingle();
  if(error||!data){toast(error?error.message:"No session with code "+code,true);return false}
  sess=data;store.set("play:sess",data.code);
  try{const u=new URL(location.href);u.searchParams.set("s",data.code);history.replaceState(null,"",u)}catch(_){}
  me=store.get("play:"+data.id,null);
  await load();
  if(me&&!(await stillMine())){me=null;store.set("play:"+sess.id,null);toast("Your team's seat was released. Join again.",true)}
  subscribe();render(true);return true;
}
async function checkSeat(){if(me&&!(await stillMine()))dropSeat("Another phone now plays for your team. Ask the facilitator if this is wrong.")}
async function stillMine(){if(!me)return false;const {data,error}=await sb.rpc("player_status",{p_team:me.team_id,p_player_key:me.key});return error?true:!!data}
async function load(){
  const [t,e,r,pk]=await Promise.all([
    sb.from("teams").select("*").eq("session_id",sess.id).order("position"),
    sb.from("score_events").select("id,team_id,points,activity,ref").eq("session_id",sess.id).range(0,4999),
    sb.from("rounds").select("id,kind,activity,ref,points,payload,status,result").eq("session_id",sess.id).order("id",{ascending:false}).limit(1),
    sb.from("product_picks").select("product,team_id").eq("session_id",sess.id)]);
  if(t.error||e.error){setConn(false);return}
  if(!pk.error)picks=new Map(pk.data.map(x=>[x.product,x.team_id]));
  teams=t.data;events=new Map(e.data.map(x=>[x.id,x]));setRound(r.error?null:r.data[0]||null);
  if(me&&!myTeam())dropSeat("Your team was removed by the facilitator.");
  else if(me&&!myTeam().claimed)dropSeat("Your team's seat was released. Join again.");
}
function dropSeat(msg){me=null;store.set("play:"+sess.id,null);shownKey="";toast(msg,true)}
function setRound(r){if(r&&round&&r.id<round.id)return;round=r}
async function claim(teamId){
  try{const d=await call("claim_team",{p_session:sess.id,p_team:teamId});me={team_id:d.team.id,key:d.player_key};store.set("play:"+sess.id,me);await load();render(true)}catch(_){await load();render(true)}
}
async function createTeam(name){
  try{const d=await call("join_new_team",{p_session:sess.id,p_name:name});me={team_id:d.team.id,key:d.player_key};store.set("play:"+sess.id,me);await load();render(true)}catch(_){}
}
async function leave(){
  try{await call("leave_team",{p_team:me.team_id,p_player_key:me.key})}catch(_){}
  me=null;store.set("play:"+sess.id,null);await load();render(true);
}

/* ---------- live updates ---------- */
function setConn(ok){$("#conn").classList.toggle("live",!!ok)}
function subscribe(){
  const old=chan;chan=null;if(old)sb.removeChannel(old);
  const f="session_id=eq."+sess.id,sid=sess.id;
  const my=chan=sb.channel("play:"+sid)
    .on("postgres_changes",{event:"*",schema:"public",table:"rounds",filter:f},p=>{if(p.new&&p.new.id){setRound(p.new);render()}})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"score_events",filter:f},p=>{events.set(p.new.id,p.new);renderHead()})
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"score_events",filter:f},p=>{events.set(p.new.id,p.new);renderHead()})
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"score_events"},p=>{if(events.delete(p.old.id))renderHead()})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"product_picks",filter:f},p=>{picks.set(p.new.product,p.new.team_id);render()})
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"product_picks"},p=>{if(p.old.session_id===sid&&picks.delete(p.old.product))render()})
    .on("postgres_changes",{event:"*",schema:"public",table:"teams"},async()=>{await load();await checkSeat();render()})
    .subscribe(st=>{if(chan!==my)return;setConn(st==="SUBSCRIBED");if(st==="SUBSCRIBED")load().then(()=>render())});
  // Polling backs up the live channel on weak venue Wi-Fi.
  // Every few seconds it also checks this phone still holds its seat (another phone may have taken it after a release).
  let n=0;clearInterval(pollT);pollT=setInterval(async()=>{if(document.visibilityState!=="visible")return;await load();if(++n%2===0)await checkSeat();render()},4000);
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&sess){load().then(()=>render())}});
window.addEventListener("online",()=>{if(sess)subscribe()});

/* ---------- rendering ---------- */
function renderHead(){
  const t=myTeam();
  if(!t){$("#me").innerHTML=sess?`<span class="mono" style="color:var(--bar-fg)">${esc(sess.code)}</span>`:"";$("#me").style.removeProperty("--tc");return}
  const pos=rankOf(t.id);
  $("#me").style.setProperty("--tc",tcol(t));
  $("#me").innerHTML=`<div><b>${esc(t.name)}</b><small>${pos?ordinal(pos)+" of "+teams.length:""}</small></div><span class="sc">${score(t.id)}</span>`;
  const lb=$("#lb");if(lb)lb.innerHTML=lbRows();
  const st=$("#stand");if(st)st.innerHTML=standRows();
  const sp=$("#speed");if(sp)sp.innerHTML=speedHtml();
}
const ordinal=n=>n+(n===1?"st":n===2?"nd":n===3?"rd":"th");

function render(force){
  renderHead();
  if(!sb){app.innerHTML=`<div class="card">The page could not load its database library. Check the connection and reload.</div>`;return}
  if(!sess)return renderCode();
  if(!me)return renderPick();

  if(round&&round.status==="open"&&round.payload&&round.payload.type==="pick"){shownKey="pick:"+round.id;return renderProducts()}
  if(round&&round.status==="open"&&round.payload&&round.payload.type==="spin"){const k="spin:"+round.id+":"+!!sentFor[round.id];if(!force&&k===shownKey)return;shownKey=k;return renderSpinTurn()}
  const key=round?round.id+":"+round.status:"none";
  if(!force&&key===shownKey)return;
  shownKey=key;
  if(!round||round.status==="cancelled")return renderWait();
  if(round.payload&&round.payload.type==="standings")return renderStandings();

/* Countdown for timed questions. It runs from the moment this phone first saw the question (phone clocks
   can't be trusted to match the server); the facilitator's screen is the one that actually locks answers. */
let seenAt={},cdTimer=null;
function startCountdown(r,secs){
  clearInterval(cdTimer);const start=seenAt[r.id]||(seenAt[r.id]=Date.now()),end=start+secs*1000;
  const draw=()=>{const n=$("#cdN");if(!n||!round||round.id!==r.id||round.status!=="open"){clearInterval(cdTimer);return}
    const left=Math.max(0,end-Date.now()),sec=Math.ceil(left/1000);
    n.textContent=left?sec+"s":"Time's up";$("#cdFill").style.width=(left/(secs*1000)*100)+"%";n.parentElement.classList.toggle("low",sec<=5);
    if(!left){clearInterval(cdTimer);app.querySelectorAll(".opt").forEach(b=>b.disabled=true);const s=$("#sent");if(s)s.textContent="Time's up. Answers are locked.";}};
  draw();cdTimer=setInterval(draw,200);
}

function speedHtml(){
  if(!round||!me)return "";
  // Quiz bonuses use "quiz-speed:<tile>" (fastest +50, 2nd +25); other timed games use "<round ref>:speed".
  const ref=String(round.ref),quiz=ref.startsWith("quiz:"),want=quiz?"quiz-speed:"+ref.slice(5):ref+":speed";
  const e=[...events.values()].find(x=>x.team_id===me.team_id&&x.ref===want);
  return e?`<div class="banner speedb">⚡ ${!quiz||e.points>=50?"Fastest":"2nd fastest"} correct answer · +${e.points}</div>`:"";
}

// Same scoring as the facilitator console: average stars per criterion, 10 points per average star.
function rateScore(r){
  const res=(r.result&&r.result.teams)||{},pres=(r.payload||{}).presenter,sums=[0,0,0],notes=[];let n=0;
  for(const [tid,x] of Object.entries(res)){
    const a=x&&x.answer;if(tid===pres||!a||!Array.isArray(a.ratings)||a.ratings.length!==3||a.ratings.some(v=>!(v>=1&&v<=5)))continue;
    n++;a.ratings.forEach((v,i)=>sums[i]+=v);if(a.note&&String(a.note).trim())notes.push([tid,String(a.note).trim()]);
  }
  const avg=sums.map(v=>n?v/n:0);
  return {avg,n,notes,pts:n?Math.round(avg.reduce((x,y)=>x+y,0)/3*10):0};
}

  else banner=pts>0?`<div class="banner good">+${pts} points</div><div id="speed">${speedHtml()}</div>`:`<div class="banner bad">${a?"Not this time":"No answer sent"}</div>`;
  if(r.kind==="choice"){
    body=`<div class="q">${esc(p.text)}</div><div class="opts">${(p.options||[]).map((o,i)=>`<button class="opt ${i===key.correct?"right":a&&a.choice===i?"wrong":""}" disabled>${p.type==="mf"?"":`<span class="k">${"ABCD"[i]}</span>`}<span>${esc(o)}</span></button>`).join("")}</div>`;
  }else if(r.kind==="multi"){
    const names=Object.fromEntries((p.pool||[]).flatMap(g=>g[1])),picks=a&&Array.isArray(a.picks)?a.picks:[];
    body=`<div class="eyebrow">Recommended for ${esc((p.persona||{}).n||"")}</div><div class="pool-fam">${(key.ideal||[]).map(id=>`<span class="chip ${picks.includes(id)?"hit":""}">${picks.includes(id)?"✓ ":""}${esc(names[id]||id)}</span>`).join("")}</div>`;
  }else{
    body=`<div class="q">${esc(p.text)}</div>${a&&Array.isArray(a.fields)?a.fields.map((f,i)=>`<div><div class="eyebrow">${esc((p.fields||[])[i]||"")}</div><div>${esc(f||"—")}</div></div>`).join(""):""}`;
  }
  app.innerHTML=`${banner}<div class="card">${head(p)}${body}</div><div class="card"><div class="eyebrow">Scoreboard</div><div class="lb" id="lb">${lbRows()}</div></div>${foot()}`;
  bindFoot();
}

/* ---------- start ---------- */
(async()=>{
  render(true);
  if(!sb)return;
  const code=new URLSearchParams(location.search).get("s")||store.get("play:sess",null);
  if(code&&!(await openSession(code))){sess=null;render(true)}
})();
})();
</script>
</body>
</html>
