<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Session Feedback · Know Your Customer</title>
<meta name="description" content="Share your feedback on the Know Your Customer, Know Your Product refresher training.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2238'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='900' font-size='30' fill='%23c4122f' text-anchor='middle'%3EKY%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column for a phone held by one person per team. Header shows the team and its score;
   the stage shows whatever the facilitator has sent: waiting, a question, or the result. */
:root{
  --paper:#eef3f6; --surface:#ffffff; --surface-2:#f6f9fb; --ink:#0f2238; --muted:#566779; --line:#d5dfe6;
  --accent:#c4122f; --accent-ink:#ffffff; --accent-soft:#fbe6ea;
  --lagoon:#0b7f83; --lagoon-soft:#dff2f2; --sun:#b77900; --sun-soft:#fdf1d8;
  --good:#16794a; --good-soft:#dcf3e6; --bad:#b42318; --bad-soft:#fde4e1;
  --shadow:0 1px 2px rgba(15,34,56,.06),0 8px 24px rgba(15,34,56,.07);
  --bar:#0f2238; --bar-fg:#eef3f6;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0a1522; --surface:#112135; --surface-2:#0e1c2d; --ink:#e6eef5; --muted:#9db0c3; --line:#22374f;
  --accent:#ff5470; --accent-ink:#1a0308; --accent-soft:#3a1420;
  --lagoon:#41c7c3; --lagoon-soft:#0f3236; --sun:#f2b84b; --sun-soft:#3a2c10;
  --good:#4cd38b; --good-soft:#0f3322; --bad:#ff7a6b; --bad-soft:#3d1713;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --bar:#050d17; --bar-fg:#e6eef5; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a1522; --surface:#112135; --surface-2:#0e1c2d; --ink:#e6eef5; --muted:#9db0c3; --line:#22374f;
  --accent:#ff5470; --accent-ink:#1a0308; --accent-soft:#3a1420;
  --lagoon:#41c7c3; --lagoon-soft:#0f3236; --sun:#f2b84b; --sun-soft:#3a2c10;
  --good:#4cd38b; --good-soft:#0f3322; --bad:#ff7a6b; --bad-soft:#3d1713;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --bar:#050d17; --bar-fg:#e6eef5; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;line-height:1.12;margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-stretch:118%;font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

.top{position:sticky;top:0;z-index:10;background:var(--bar);color:var(--bar-fg);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-stretch:120%;font-weight:800;font-size:.95rem;margin-right:auto;color:var(--bar-fg)}
main{max-width:560px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:1.05rem}
.btn:disabled{opacity:.55;cursor:default}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;color:var(--ink)}
textarea.field{min-height:84px;resize:vertical}
.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--f-mono);font-size:1.6rem;text-align:center}
.hero h1{font-size:1.6rem}
.hero p{margin:0;color:var(--muted)}
.q{font-family:var(--f-display);font-stretch:106%;font-weight:750;font-size:1.12rem;line-height:1.25}
.q .n{color:var(--accent);margin-right:4px}
.opt-tag{font-size:.78rem;font-weight:600;color:var(--muted);font-family:var(--f-body)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{border:2px solid var(--line);background:var(--surface-2);border-radius:12px;min-height:54px;font-family:var(--f-mono);font-weight:700;font-size:1.3rem}
.scale button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:-4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 13px;font-size:.95rem;font-weight:650}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
.err{color:var(--bad);font-weight:700;font-size:.92rem}
.done{align-items:center;text-align:center;padding:30px 18px}
.done .tick{width:72px;height:72px;border-radius:50%;background:var(--good-soft);color:var(--good);display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:900}
.shift{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-mono);font-weight:700;font-size:1.6rem}
.shift small{display:block;font-family:var(--f-body);font-size:.72rem;color:var(--muted);font-weight:600}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad);color:#fff}
@media (max-width:360px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><span class="brand">Refresher Training 2026 · Feedback</span></div></header>
<main id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="vendor/supabase-2.117.3.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("kykp:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("kykp:"+k,JSON.stringify(v))}catch(e){}}};
const SB_URL="https://jtofxcdoyzyyxdlbjrbh.supabase.co", SB_KEY="sb_publishable_UduFSvz4bpmCY41kxjLRww_iufXEQpx";
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}}):null;
const app=$("#app");
const ACTIVITIES=["True or False","Product Passport","Product Challenge","Listen for the Clue","Spin & Explain"];
const CONF_Q="how confident were you explaining BML's financing products to a customer?";

function toast(msg,bad){const el=$("#toast");el.textContent=msg;el.classList.toggle("bad",!!bad);el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,bad?5000:2200)}
// A random id kept on this phone, so sending again replaces this person's earlier answer instead of adding one.
let device=store.get("fbdevice",null);
if(!device){device=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));store.set("fbdevice",device)}

const code=(new URLSearchParams(location.search).get("s")||"").trim().toUpperCase();
let f=null;

function askCode(msg){
  app.innerHTML=`<form class="card" id="cf"><div class="hero"><h1>Session feedback</h1><p>Enter the session code shown on the screen.</p></div>
    <input class="field code" id="cc" maxlength="6" autocomplete="off" autocapitalize="characters" aria-label="Session code" placeholder="CODE">
    ${msg?`<div class="err">${esc(msg)}</div>`:""}<button class="btn primary">Continue</button></form>`;
  $("#cf").onsubmit=e=>{e.preventDefault();const v=$("#cc").value.trim().toUpperCase();if(v){const u=new URL(location.href);u.searchParams.set("s",v);location.href=u.toString()}};
}

const scale=(key,lo,hi)=>`<div class="scale" role="group" data-k="${key}">${[1,2,3,4,5].map(n=>`<button type="button" data-v="${n}" aria-pressed="${f[key]===n}">${n}</button>`).join("")}</div><div class="ends"><span>1 · ${lo}</span><span>5 · ${hi}</span></div>`;

function form(){
  app.innerHTML=`<div class="card hero"><div class="eyebrow">Know your customer, know your product</div><h1>How did today go?</h1>
      <p>Two minutes, on your own phone. Your answers help us improve the next session.</p></div>
    <form class="card" id="ff" novalidate>
      <div class="q"><span class="n">1</span>Before today's session, ${esc(CONF_Q)}</div>${scale("before","Not confident","Very confident")}
      <div class="q"><span class="n">2</span>Now, after the session, how confident are you explaining BML's financing products to a customer?</div>${scale("after","Not confident","Very confident")}
      <div class="q"><span class="n">3</span>Overall, how useful was this session for your work?</div>${scale("rating","Not useful","Very useful")}
      <div class="q"><span class="n">4</span>Which activity helped you the most? <span class="opt-tag">optional</span></div>
      <div class="chips" id="useful">${ACTIVITIES.map(a=>`<button type="button" class="chip" data-a="${esc(a)}" aria-pressed="${f.useful===a}">${esc(a)}</button>`).join("")}</div>
      <div class="q"><span class="n">5</span>Your commitment: one product you will explain more confidently, or one thing you will do differently with customers <span class="opt-tag">optional</span></div>
      <textarea class="field" id="commitment" maxlength="600">${esc(f.commitment)}</textarea>
      <div class="q"><span class="n">6</span>What should we improve next time? <span class="opt-tag">optional</span></div>
      <textarea class="field" id="comment" maxlength="1500">${esc(f.comment)}</textarea>
      <div class="two"><label>Your name <span class="opt-tag">optional</span><input class="field" id="name" maxlength="80" autocomplete="name" value="${esc(f.name)}"></label>
        <label>Branch or department <span class="opt-tag">optional</span><input class="field" id="unit" maxlength="80" value="${esc(f.unit)}"></label></div>
      <div class="err" id="err" hidden></div>
      <button class="btn primary" id="send">Send feedback</button>
    </form>`;
  $$(".scale").forEach(g=>g.onclick=e=>{const b=e.target.closest("button");if(!b)return;f[g.dataset.k]=+b.dataset.v;
    g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));store.set("fb:"+code,f)});
  $("#useful").onclick=e=>{const b=e.target.closest("button");if(!b)return;f.useful=f.useful===b.dataset.a?null:b.dataset.a;
    $$("#useful .chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.a===f.useful));store.set("fb:"+code,f)};
  ["commitment","comment","name","unit"].forEach(k=>$("#"+k).oninput=e=>{f[k]=e.target.value;store.set("fb:"+code,f)});
  $("#ff").onsubmit=send;
}

async function send(e){
  e.preventDefault();const err=$("#err");
  const missing=[["before",1],["after",2],["rating",3]].filter(([k])=>!f[k]).map(([,n])=>n);
  if(missing.length){err.textContent=`Please answer question${missing.length>1?"s":""} ${missing.length>1?missing.slice(0,-1).join(", ")+" and "+missing.at(-1):missing[0]}.`;err.hidden=false;
    document.querySelector(`.scale[data-k="${["before","after","rating"][missing[0]-1]}"]`).scrollIntoView({behavior:"smooth",block:"center"});return}
  err.hidden=true;
  if(!sb){toast("Could not connect. Check your internet and try again.",true);return}
  const btn=$("#send");btn.disabled=true;btn.textContent="Sending…";
  const {error}=await sb.rpc("submit_feedback",{p_code:code,p_device:device,p_before:f.before,p_after:f.after,p_rating:f.rating,
    p_useful:f.useful||"",p_commitment:f.commitment||"",p_comment:f.comment||"",p_name:f.name||"",p_unit:f.unit||""});
  btn.disabled=false;btn.textContent="Send feedback";
  if(error){err.textContent=error.message||"Could not send. Check your internet and try again.";err.hidden=false;return}
  f.sent=true;store.set("fb:"+code,f);thanks();
}

function thanks(){
  const d=f.after-f.before;
  app.innerHTML=`<div class="card done"><div class="tick">✓</div><h1>Thank you!</h1>
    <p class="muted" style="margin:0">Your feedback has been sent to the facilitator.</p>
    <div class="shift"><div>${f.before}<small>Before</small></div><span aria-hidden="true">→</span><div>${f.after}<small>Now</small></div></div>
    <p style="margin:0;font-weight:700">${d>0?`Your confidence went up by ${d}. Well done!`:d===0?"Keep practising: your confidence will grow.":"Thanks for being honest. Talk to your facilitator about what would help."}</p>
    ${f.commitment?`<p style="margin:0" class="muted">Your commitment: <b style="color:var(--ink)">${esc(f.commitment)}</b></p>`:""}
    <button class="linkbtn" id="edit">Change my answers</button></div>`;
  $("#edit").onclick=form;
}

if(!code)askCode();
else{f=Object.assign({before:null,after:null,rating:null,useful:null,commitment:"",comment:"",name:"",unit:""},store.get("fb:"+code,{}));
  if(f.sent)thanks();else form()}
})();
</script>
</body>
</html>
